services:
  app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: myapp
    ports:
      - "5000:5000"
    environment:
      APP_ENV: ${APP_ENV}
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  app-data:
